services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile
    image: password-vault:latest
    container_name: password-vault
    ports:
      - "${VAULT_PORT:-8080}:8080"
    environment:
      # Required — set in .env or export before running docker compose up
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?VAULT_MASTER_KEY is required. Run: vault-cli init}
      VAULT_DB_PATH: /vault/data/vault.db
      VAULT_PORT: "8080"
      VAULT_RATE_LIMIT: "${VAULT_RATE_LIMIT:-5}"
    volumes:
      # Persist vault.db across container restarts
      - vault-data:/vault/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Drop all Linux capabilities — vault needs none
    cap_drop:
      - ALL
    # Read-only root filesystem; only /vault/data (the volume) is writable
    read_only: true
    tmpfs:
      - /tmp

  # One-off admin helper — run vault-cli commands via:
  #   docker compose run --rm vault-cli token list
  #   docker compose run --rm vault-cli secret add --key foo --value bar
  vault-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: password-vault:latest
    entrypoint: ["vault-cli"]
    environment:
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?VAULT_MASTER_KEY is required}
      VAULT_DB_PATH: /vault/data/vault.db
    volumes:
      - vault-data:/vault/data
    profiles:
      - cli  # not started by default; only via docker compose run

volumes:
  vault-data:
    driver: local
