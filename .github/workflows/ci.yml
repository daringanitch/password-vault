name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false  # go.sum not committed; caching handled manually below

      - name: Cache Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('go.mod') }}
          restore-keys: go-mod-${{ runner.os }}-${{ matrix.go }}-

      - name: Download dependencies
        run: go mod tidy && go mod download

      - name: go vet
        run: go vet ./...

      - name: Run tests (race detector + coverage)
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage report
        if: matrix.go == 'stable'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ─── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false  # go.sum not committed; caching handled manually below

      - name: Cache Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-1.24-${{ hashFiles('go.mod') }}
          restore-keys: go-mod-${{ runner.os }}-1.24-

      - name: Download dependencies
        run: go mod tidy && go mod download

      - name: Build vault (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/vault ./cmd/vault

      - name: Build vault-cli (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/vault-cli ./cmd/vault-cli

      - name: Verify binaries run
        run: |
          bin/vault --help
          bin/vault-cli --help

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-linux-amd64
          path: bin/
          retention-days: 7
